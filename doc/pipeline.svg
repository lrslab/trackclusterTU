<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">trackclusterTU pipeline and method overview</title>
  <desc id="desc">Simplified publication figure showing the trackclusterTU pipeline, two-round TU clustering, and optional missed-TU rescue process.</desc>
  <defs>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 800 38px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .subtitle { font: 500 18px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .panel-label { font: 800 22px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .panel-title { font: 800 20px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .box-title { font: 800 18px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #111827; letter-spacing: 0; }
      .box-title-teal { font: 800 18px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #0f766e; letter-spacing: 0; }
      .box-title-orange { font: 800 18px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #ea580c; letter-spacing: 0; }
      .body { font: 500 14px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .small { font: 500 12.5px Inter, Avenir, Helvetica, Arial, sans-serif; fill: #64748b; letter-spacing: 0; }
      .mono { font: 650 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; letter-spacing: 0; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .box-teal { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.6; }
      .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .arrow { fill: none; stroke: #0f766e; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
      .arrow-orange { fill: none; stroke: #ea580c; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowOrange); }
      .arrow-gray { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGray); }
      .read-teal { fill: none; stroke: #0f766e; stroke-width: 4; stroke-linecap: round; }
      .read-orange { fill: none; stroke: #ea580c; stroke-width: 4; stroke-linecap: round; }
      .read-gray { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; }
      .thin-track { fill: none; stroke: #cbd5e1; stroke-width: 1.6; stroke-linecap: round; }
      .cluster-teal { fill: none; stroke: #0f766e; stroke-width: 2; stroke-dasharray: 5 5; }
      .cluster-orange { fill: none; stroke: #ea580c; stroke-width: 2; stroke-dasharray: 5 5; }
      .tu-teal { fill: #0f766e; opacity: 0.88; }
      .tu-orange { fill: #ea580c; opacity: 0.88; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="940" fill="#ffffff"/>

  <g transform="translate(80 64)">
    <text class="title" x="0" y="0">trackclusterTU pipeline</text>
    <text class="subtitle" x="0" y="34">Long-read bacterial transcript-unit discovery with two-round interval clustering and optional boundary-mode rescue.</text>
  </g>

  <g transform="translate(1190 42)">
    <rect class="note" x="0" y="0" width="330" height="92" rx="10"/>
    <text class="mono" x="22" y="31">score1 = overlap / union</text>
    <text class="mono" x="22" y="55">score2 = overlap / max(len)</text>
    <text class="mono" x="22" y="79">default thresholds: 0.95, 0.80</text>
  </g>

  <g id="panel-a" transform="translate(80 160)">
    <rect class="panel" x="0" y="0" width="1440" height="190" rx="12"/>
    <text class="panel-label" x="24" y="40">A</text>
    <text class="panel-title" x="58" y="40">Main workflow</text>

    <g transform="translate(84 72)">
      <rect class="box" x="0" y="0" width="170" height="82" rx="8"/>
      <text class="box-title" x="18" y="31">Input reads</text>
      <text class="body" x="18" y="55">FASTQ manifest</text>
      <text class="small" x="18" y="73">sample, group, reads</text>
    </g>

    <path class="arrow" d="M266 113H336"/>
    <g transform="translate(348 72)">
      <rect class="box" x="0" y="0" width="170" height="82" rx="8"/>
      <text class="box-title" x="18" y="31">Map</text>
      <text class="body" x="18" y="55">minimap2</text>
      <text class="small" x="18" y="73">samtools sort/index</text>
    </g>

    <path class="arrow" d="M530 113H600"/>
    <g transform="translate(612 72)">
      <rect class="box" x="0" y="0" width="170" height="82" rx="8"/>
      <text class="box-title" x="18" y="31">BED6 spans</text>
      <text class="body" x="18" y="55">pooled intervals</text>
      <text class="small" x="18" y="73">sample-tagged reads</text>
    </g>

    <path class="arrow" d="M794 113H864"/>
    <g transform="translate(876 58)">
      <rect class="box-teal" x="0" y="0" width="212" height="110" rx="8"/>
      <text class="box-title-teal" x="18" y="31">TU clustering</text>
      <text class="body" x="18" y="55">round 1: score1 seeds</text>
      <text class="body" x="18" y="78">round 2: score2 attach</text>
      <g transform="translate(23 89)">
        <path class="read-teal" d="M0 0h58"/>
        <path class="read-orange" d="M78 0h58"/>
      </g>
    </g>

    <path class="arrow" d="M1100 113H1170"/>
    <g transform="translate(1182 72)">
      <rect class="box" x="0" y="0" width="190" height="82" rx="8"/>
      <text class="box-title" x="18" y="31">Outputs</text>
      <text class="body" x="18" y="55">TUs, membership</text>
      <text class="small" x="18" y="73">TU/gene count tables</text>
    </g>

    <g transform="translate(612 22)">
      <rect class="note" x="0" y="0" width="224" height="34" rx="7"/>
      <text class="mono" x="14" y="22">reference + annotation</text>
    </g>
    <path class="arrow-gray" d="M836 39C893 39 898 65 914 78"/>
  </g>

  <g id="panel-b" transform="translate(80 390)">
    <rect class="panel" x="0" y="0" width="1440" height="270" rx="12"/>
    <text class="panel-label" x="24" y="40">B</text>
    <text class="panel-title" x="58" y="40">Two-round clustering design</text>

    <g transform="translate(82 78)">
      <rect class="box" x="0" y="0" width="250" height="144" rx="8"/>
      <text class="box-title" x="20" y="30">Partition</text>
      <text class="body" x="20" y="54">contig + strand</text>
      <text class="body" x="20" y="76">overlap regions</text>
      <g transform="translate(24 100)">
        <path class="thin-track" d="M0 0h180"/>
        <path class="read-teal" d="M14 0h66"/>
        <path class="read-gray" d="M70 18h76"/>
        <path class="read-orange" d="M132 36h52"/>
      </g>
    </g>

    <path class="arrow" d="M344 150H430"/>
    <g transform="translate(442 78)">
      <rect class="box-teal" x="0" y="0" width="260" height="144" rx="8"/>
      <text class="box-title-teal" x="20" y="30">Round 1</text>
      <text class="body" x="20" y="54">seed clusters by score1</text>
      <text class="small" x="20" y="75">high-overlap intervals joined by DSU</text>
      <g transform="translate(30 92)">
        <path class="read-teal" d="M0 0h80M12 17h78M4 34h80"/>
        <path class="read-orange" d="M132 0h70M146 17h68M132 34h70"/>
        <ellipse class="cluster-teal" cx="48" cy="17" rx="54" ry="30"/>
        <ellipse class="cluster-orange" cx="168" cy="17" rx="48" ry="30"/>
      </g>
    </g>

    <path class="arrow" d="M714 150H800"/>
    <g transform="translate(812 78)">
      <rect class="box-teal" x="0" y="0" width="280" height="144" rx="8"/>
      <text class="box-title-teal" x="20" y="30">Round 2</text>
      <text class="body" x="20" y="54">attach contained seed clusters</text>
      <text class="small" x="20" y="75">score2 + strand-aware 3p tolerance</text>
      <g transform="translate(32 102)">
        <path class="read-teal" d="M0 0h146"/>
        <path class="read-orange" d="M36 22h88"/>
        <path class="arrow-gray" d="M130 22C164 22 174 0 206 0"/>
      </g>
    </g>

    <path class="arrow" d="M1104 150H1190"/>
    <g transform="translate(1202 78)">
      <rect class="box" x="0" y="0" width="170" height="144" rx="8"/>
      <text class="box-title" x="20" y="30">Final TUs</text>
      <text class="body" x="20" y="54">representative spans</text>
      <text class="small" x="20" y="75">read-to-TU membership</text>
      <g transform="translate(24 106)">
        <rect class="tu-teal" x="0" y="0" width="64" height="14" rx="3"/>
        <rect class="tu-orange" x="76" y="0" width="58" height="14" rx="3"/>
      </g>
    </g>
  </g>

  <g id="panel-c" transform="translate(80 700)">
    <rect class="panel" x="0" y="0" width="1440" height="174" rx="12"/>
    <text class="panel-label" x="24" y="40">C</text>
    <text class="panel-title" x="58" y="40">Optional missed-TU rescue</text>
    <text class="small" x="58" y="63">Separate post-clustering pass; original clustering outputs are not modified in place.</text>

    <g transform="translate(260 72)">
      <rect class="box-orange" x="0" y="0" width="190" height="70" rx="8"/>
      <text class="box-title-orange" x="18" y="28">Cluster outputs</text>
      <text class="small" x="18" y="50">pooled BED + TU BED</text>
    </g>
    <path class="arrow-orange" d="M462 107H542"/>
    <g transform="translate(554 72)">
      <rect class="box-orange" x="0" y="0" width="220" height="70" rx="8"/>
      <text class="box-title-orange" x="18" y="28">Diagnose</text>
      <text class="small" x="18" y="50">3p families, 5p modes, support</text>
    </g>
    <path class="arrow-orange" d="M786 107H866"/>
    <g transform="translate(878 72)">
      <rect class="box-orange" x="0" y="0" width="220" height="70" rx="8"/>
      <text class="box-title-orange" x="18" y="28">Rescue</text>
      <text class="small" x="18" y="50">deduplicate and reassign reads</text>
    </g>
    <path class="arrow-orange" d="M1110 107H1190"/>
    <g transform="translate(1202 72)">
      <rect class="box-orange" x="0" y="0" width="170" height="70" rx="8"/>
      <text class="box-title-orange" x="18" y="28">Recount</text>
      <text class="small" x="18" y="50">rescued TU matrices</text>
    </g>
  </g>

  <g transform="translate(80 910)">
    <text class="small" x="0" y="0">Intervals use 0-based, half-open coordinates. BED12 inputs are clustered by outer transcript span only.</text>
  </g>
</svg>
