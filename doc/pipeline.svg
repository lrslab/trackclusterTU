<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">trackclusterTU: from long reads to bacterial transcript units</title>
  <desc id="desc">Workflow overview. Start with FASTQ and a reference genome, sorted BAM, or read intervals. Validate and pool reads while retaining sample identity, then partition by contig and strand. Discover TUs without gene annotation: seed similar spans with score1, optionally pool truncated reads with score2 and a one-sided 3-prime overhang limit, then resolve consensus boundaries using anchor-quality members. Contained fragments contribute support without moving boundaries; distinct endpoint modes remain separate. Reassign reads against emitted TUs and report TU boundaries, membership, and abundance across samples and groups. Optional gene annotation adds gene relationships, transcript classifications, gene counts, and genome-browser tracks. After clustering, diagnose-missed-tus and rescue-missed-tus independently detect supported boundary modes from the same original reads and TU calls; rescue also uses membership. Recount can update TU sample and group counts from rescued membership and a sample manifest. The run command covers the main pipeline but does not run diagnosis or rescue. All read, TU, gene, and matrix illustrations are schematic.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #163337; }
      .brand { font-size: 23px; font-weight: 750; letter-spacing: -.4px; }
      .title { font-size: 39px; font-weight: 750; letter-spacing: -1.1px; }
      .subtitle { font-size: 21px; fill: #52666a; }
      .section { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
      .heading { font-size: 23px; font-weight: 700; letter-spacing: -.3px; }
      .body { font-size: 19px; fill: #38575a; }
      .small { font-size: 17px; fill: #52666a; }
      .mini { font-size: 16px; fill: #52666a; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 17px; fill: #28585a; }
      .command { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 18px; font-weight: 600; }
      .number { font-size: 19px; font-weight: 750; fill: #ffffff; text-anchor: middle; }
      .teal { fill: #087e80; }
      .orange { fill: #a54d16; }
      .panel { fill: #f5f8f8; stroke: #d7e2e2; stroke-width: 1.5; }
      .output { fill: #ffffff; stroke: #cddede; stroke-width: 1.5; }
      .flow { fill: none; stroke: #4b777b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #738c8f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .optional { fill: none; stroke: #b96a35; stroke-width: 2; stroke-dasharray: 5 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .read { fill: none; stroke: #087e80; stroke-width: 7; stroke-linecap: round; }
      .fragment { fill: none; stroke: #83b9b7; stroke-width: 7; stroke-linecap: round; }
      .boundary { fill: none; stroke: #82aaa8; stroke-width: 1.5; stroke-dasharray: 4 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#4b777b"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9Z" fill="#b96a35"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" rx="20" fill="#ffffff"/>
  <path d="M41 37H61M46 46H67M41 55H61" fill="none" stroke="#087e80" stroke-width="5" stroke-linecap="round"/>
  <text class="brand" x="80" y="55">trackcluster<tspan class="teal">TU</tspan></text>
  <text class="small" x="1160" y="53" text-anchor="end">Rust CLI · single or multiple samples</text>
  <text class="title" x="40" y="108">From long reads to bacterial transcript units</text>
  <text class="subtitle" x="40" y="142">Discover transcript boundaries, quantify TU abundance, and connect transcripts to genes.</text>

  <!-- Multiple entry points converge on strand-aware read intervals. -->
  <g id="prepare">
    <circle cx="57" cy="183" r="17" fill="#355d62"/>
    <text class="number" x="57" y="190">1</text>
    <text class="section" x="88" y="192">Prepare read intervals</text>
    <text class="small" x="1160" y="189" text-anchor="end">Enter at FASTQ, BAM, or intervals</text>
    <rect class="panel" x="40" y="212" width="1120" height="158" rx="16"/>

    <text class="heading" x="62" y="249">FASTQ reads</text>
    <text class="body" x="62" y="279">+ reference FASTA</text>
    <text class="command" x="62" y="316">map</text>
    <text class="mini" x="62" y="343">minimap2 + samtools</text>
    <path class="flow" d="M291 288H322"/>

    <text class="heading" x="342" y="249">Sorted BAM</text>
    <text class="body" x="342" y="279">mapped long reads</text>
    <text class="command" x="342" y="316">bam-to-bed</text>
    <text class="mini" x="342" y="343">conversion + read filters</text>
    <path class="flow" d="M557 288H588"/>

    <text class="heading" x="609" y="249">Read intervals</text>
    <text class="body" x="609" y="279">BED6 / BED12 / TSV</text>
    <text class="small" x="609" y="316">outer span + strand</text>
    <text class="mini" x="609" y="343">single file or manifest</text>
    <path class="flow" d="M822 288H853"/>

    <text class="heading" x="875" y="249">Validate &amp; pool</text>
    <text class="body" x="875" y="279">retain sample identity</text>
    <text class="small" x="875" y="316">partition by contig</text>
    <text class="small" x="875" y="343">and strand</text>
    <path class="flow" d="M600 371V400"/>
  </g>

  <!-- Default discovery: raw score1 components, optional attachment, final consensus. -->
  <g id="discover">
    <circle cx="57" cy="422" r="17" fill="#087e80"/>
    <text class="number" x="57" y="429">2</text>
    <text class="section" x="88" y="431">Discover transcript units</text>
    <text class="small" x="1160" y="428" text-anchor="end">cluster · no annotation required</text>
    <rect x="40" y="450" width="1120" height="340" rx="16" fill="#eff8f5" stroke="#bcdbd4" stroke-width="1.5"/>
    <path d="M412 474V734M787 474V734" stroke="#cee2dd" stroke-width="1.5"/>

    <text class="heading" x="62" y="488">Seed similar spans</text>
    <g transform="translate(76 522)">
      <text class="mini" x="15" y="0">5′</text>
      <text class="mini" x="257" y="0">3′</text>
      <rect x="5" y="13" width="286" height="85" rx="12" fill="#e2f1ec" stroke="#82b6a9" stroke-width="1.5" stroke-dasharray="5 4"/>
      <path class="read" d="M23 31H274M27 55H274M23 79H269"/>
      <path class="fragment" d="M79 123H266"/>
    </g>
    <text class="body" x="62" y="688">score1 = overlap / union</text>
    <text class="small" x="62" y="716">Seed threshold: <tspan font-weight="700" class="teal">0.95</tspan></text>
    <path class="flow" d="M386 586H436"/>

    <text class="heading" x="437" y="488">Pool truncated reads</text>
    <g transform="translate(451 522)">
      <text class="mini" x="14" y="0">5′</text>
      <text class="mini" x="242" y="0">3′</text>
      <path class="boundary" d="M250 12V115"/>
      <path class="read" d="M19 26H250"/>
      <path class="fragment" d="M65 51H245M25 76H209M55 101H263"/>
      <path d="M250 101H263" fill="none" stroke="#b96a35" stroke-width="7" stroke-linecap="round"/>
      <path d="M250 120V126H267V120" fill="none" stroke="#b96a35" stroke-width="1.5"/>
      <text class="mini orange" x="205" y="149">≤ 12 bp</text>
    </g>
    <text class="body" x="437" y="688">score2 = overlap / longer</text>
    <text class="small" x="437" y="716">Threshold: <tspan font-weight="700" class="teal">0.80</tspan> · internal 3′ ends allowed</text>
    <path class="flow" d="M761 586H811"/>

    <text class="heading" x="812" y="488">Set consensus boundaries</text>
    <g transform="translate(826 522)">
      <text class="mini" x="18" y="0">5′</text>
      <text class="mini" x="259" y="0">3′</text>
      <path class="boundary" d="M25 12V139M274 12V139"/>
      <path class="read" d="M25 23H274M29 43H274M25 63H269"/>
      <path class="fragment" d="M89 83H249M129 103H269"/>
      <path d="M25 113H259V106L274 120L259 134V127H25Z" fill="#087e80"/>
      <text x="145" y="125" font-size="16" font-weight="700" style="fill:#ffffff">TU</text>
    </g>
    <text class="body" x="812" y="688">Anchor-quality reads set ends.</text>
    <text class="small" x="812" y="716">Fragments add support only.</text>

    <path d="M62 739H1138" stroke="#cee2dd" stroke-width="1.5"/>
    <text class="small" x="62" y="768">Check each family against its final consensus; keep distinct endpoint modes separate.</text>
    <path class="flow" d="M600 791V819"/>
  </g>

  <!-- Emitted TUs are the common reference for membership, counting, and gene interpretation. -->
  <g id="report">
    <circle cx="57" cy="843" r="17" fill="#087e80"/>
    <text class="number" x="57" y="850">3</text>
    <text class="section" x="88" y="852">Assign reads and report results</text>
    <text class="small" x="1160" y="849" text-anchor="end">One shared TU catalogue across samples</text>
    <rect class="panel" x="40" y="871" width="1120" height="87" rx="14"/>
    <text class="heading" x="62" y="903">Re-score reads against emitted TUs</text>
    <text class="small" x="1138" y="902" text-anchor="end">After optional TU support filtering</text>
    <text class="body" x="62" y="934">unique · partial · ambiguous · unassigned</text>
    <text class="small" x="1138" y="933" text-anchor="end">Optional fractional assignment</text>
    <path class="branch" d="M600 958V975M215 975H985"/>
    <path class="flow" d="M215 975V994"/>
    <path class="flow" d="M600 975V994"/>
    <path class="flow" d="M985 975V994"/>

    <rect class="output" x="40" y="997" width="350" height="225" rx="14"/>
    <text class="heading" x="62" y="1030">TU catalogue</text>
    <g transform="translate(62 1060)">
      <path d="M57 0H304M57 27H304M57 54H304" stroke="#e0e9e9" stroke-width="2"/>
      <text class="mini" x="0" y="5">TU1</text>
      <text class="mini" x="0" y="32">TU2</text>
      <text class="mini" x="0" y="59">TU3</text>
      <path d="M62 -6H284L295 0L284 6H62Z" fill="#087e80"/>
      <path d="M114 21H284L295 27L284 33H114Z" fill="#7676a7"/>
      <path d="M62 48H220L231 54L220 60H62Z" fill="#4e9b9b"/>
    </g>
    <text class="body" x="62" y="1155">Boundaries + read membership</text>
    <text class="mono" x="62" y="1182">tus.bed · membership.tsv</text>
    <text class="small" x="62" y="1207">Endpoint support + stable IDs</text>

    <rect class="output" x="425" y="997" width="350" height="225" rx="14"/>
    <text class="heading" x="447" y="1030">TU abundance</text>
    <g transform="translate(447 1055)">
      <text class="mini" x="76" y="0">S1</text>
      <text class="mini" x="155" y="0">S2</text>
      <text class="mini" x="234" y="0">S3</text>
      <text class="mini" x="0" y="26">TU1</text>
      <text class="mini" x="0" y="50">TU2</text>
      <text class="mini" x="0" y="74">TU3</text>
      <rect x="57" y="10" width="68" height="19" rx="3" fill="#087e80"/>
      <rect x="136" y="10" width="68" height="19" rx="3" fill="#65aaa8"/>
      <rect x="215" y="10" width="68" height="19" rx="3" fill="#b3d4cf"/>
      <rect x="57" y="34" width="68" height="19" rx="3" fill="#dcebe6"/>
      <rect x="136" y="34" width="68" height="19" rx="3" fill="#b3d4cf"/>
      <rect x="215" y="34" width="68" height="19" rx="3" fill="#087e80"/>
      <rect x="57" y="58" width="68" height="19" rx="3" fill="#b3d4cf"/>
      <rect x="136" y="58" width="68" height="19" rx="3" fill="#087e80"/>
      <rect x="215" y="58" width="68" height="19" rx="3" fill="#65aaa8"/>
    </g>
    <text class="body" x="447" y="1155">Per TU, sample, and group</text>
    <text class="mono" x="447" y="1182">tu_count.csv</text>
    <text class="small" x="447" y="1207">TU sample / group matrices</text>

    <rect x="810" y="997" width="350" height="225" rx="14" fill="#f7f7fb" stroke="#d9d9e8" stroke-width="1.5"/>
    <text class="heading" x="832" y="1030">Gene interpretation</text>
    <text class="mini" x="832" y="1055">With optional GFF3 / BED annotation</text>
    <g transform="translate(832 1080)">
      <path d="M0 1H305" stroke="#d8dde4" stroke-width="2"/>
      <path d="M16 -9H122L133 1L122 11H16ZM173 -9H279L290 1L279 11H173Z" fill="#d4d5e3"/>
      <text x="46" y="6" font-size="14" style="fill:#51516e">gene A</text>
      <text x="205" y="6" font-size="14" style="fill:#51516e">gene B</text>
      <path d="M5 28H294L305 35L294 42H5Z" fill="#087e80"/>
      <text x="112" y="40" font-size="14" font-weight="600" style="fill:#ffffff">readthrough</text>
    </g>
    <text class="body" x="832" y="1155">Gene links + transcript classes</text>
    <text class="mono" x="832" y="1182" style="font-size:16px">tu_gene.tsv · tu_semantics.tsv</text>
    <text class="small" x="832" y="1207">Gene counts · GFF3 · BED12</text>
  </g>

  <!-- Diagnosis and rescue are parallel uses of the original inputs, not a serial dependency. -->
  <g id="optional-recovery">
    <text class="section orange" x="40" y="1266">Optional missed-TU recovery</text>
    <text class="small" x="1160" y="1263" text-anchor="end">Separate commands after run / cluster</text>
    <rect x="40" y="1286" width="1120" height="158" rx="16" fill="#fff8f0" stroke="#e9d1b9" stroke-width="1.5"/>

    <text class="heading" x="62" y="1327" style="font-size:21px">Same input reads</text>
    <text class="small" x="62" y="1355">+ existing TU calls</text>
    <text class="mini" x="62" y="1383">+ membership for rescue</text>
    <path d="M281 1351H302V1320M302 1351V1377" fill="none" stroke="#b96a35" stroke-width="2"/>
    <path class="optional" d="M302 1320H324"/>
    <path class="optional" d="M302 1377H324"/>

    <text class="command orange" x="337" y="1326">diagnose-missed-tus</text>
    <path class="optional" d="M541 1320H571"/>
    <text class="body" x="587" y="1326">Candidate report</text>

    <text class="command orange" x="337" y="1383">rescue-missed-tus</text>
    <path class="optional" d="M541 1377H571"/>
    <text class="body" x="587" y="1375">Updated TU calls</text>
    <text class="small" x="587" y="1401">membership + TU counts</text>
    <path class="optional" d="M820 1377H878"/>

    <text class="mini" x="900" y="1326">+ sample manifest</text>
    <path class="optional" d="M985 1334V1357"/>
    <text class="command orange" x="900" y="1383">recount</text>
    <text class="small" x="900" y="1408">TU sample / group counts</text>
    <text class="mini orange" x="62" y="1426">Both commands independently detect supported 5′ modes within strand-aware 3′ families.</text>
  </g>

  <text class="small" x="40" y="1480">run covers steps 1–3. Defaults shown; the score2 pass can be disabled.</text>
  <text class="mini" x="1160" y="1480" text-anchor="end">Illustrations are schematic.</text>
</svg>
