[package]
name = "trackclustertu"
version = "0.2.0"
publish = false
edition = "2021"
rust-version = "1.88"
default-run = "trackclustertu"
license = "MIT"
description = "Fast interval similarity and scalable clustering for bacterial transcript units"
readme = "README.md"
repository = "https://github.com/lrslab/trackclusterTU"
homepage = "https://github.com/lrslab/trackclusterTU"
keywords = ["bioinformatics", "genomics", "interval", "clustering", "nanopore"]

[dependencies]
anyhow = "1.0.79"
clap = { version = "4.5.27", features = ["derive"] }
csv = "1.4.0"
noodles = { version = "0.108.0", features = ["bam", "bgzf", "core", "sam"] }
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.11"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }
proptest = "1.6.0"

[[bench]]
name = "intersection"
harness = false

[[bench]]
name = "clustering"
harness = false

[[bench]]
name = "endpoint_modes"
harness = false
